<main class="auth-page"><a routerLink="/" class="back">← Volver al inicio</a><section class="auth-card"><div class="auth-copy"><span class="logo">AR</span><span class="eyebrow">Haz parte</span><h1>Crea tu cuenta</h1><p>Conecta con nuestra comunidad y conoce nuevas formas de participar.</p></div><form (ngSubmit)="submit()"><div class="field"><label for="name">Nombre completo</label><input id="name" name="name" [(ngModel)]="name" placeholder="Tu nombre" required></div><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" [(ngModel)]="email" placeholder="tu@correo.com" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Mínimo 6 caracteres" required></div>@if(error()){<p class="error">{{error()}}</p>}<button class="btn btn-primary" type="submit">Crear cuenta</button><p class="switch">¿Ya tienes una cuenta? <a routerLink="/login">Ingresa</a></p></form></section></main>
